<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow: hidden;
            text-align: center;
            display: none; /* Hidden until loaded */
        }
        .card-header {
            background: #007bff;
            color: white;
            padding: 30px 20px 50px;
            position: relative;
        }
        .card-header h2 { margin: 0; font-size: 22px; }
        .photo-wrapper {
            margin-top: -45px;
            display: flex;
            justify-content: center;
        }
        .photo-wrapper img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background: #e9ecef;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .teacher-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 15px 0 5px;
        }
        .teacher-badge {
            display: inline-block;
            background: #e8f4fd;
            color: #007bff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .details-list {
            text-align: left;
            padding: 0 25px 25px;
        }
        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid #f1f1f1;
            display: flex;
            justify-content: space-between;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }
        .detail-value {
            color: #222;
            font-size: 14px;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
        #status-msg {
            text-align: center;
            font-size: 18px;
            color: #555;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

    <div id="status-msg">Loading teacher profile...</div>

    <div class="profile-card" id="profileCard">
        <div class="card-header">
            <h2>Teacher Identity Card</h2>
        </div>
        <div class="photo-wrapper">
            <img id="photo" src="https://placehold.co/110x110?text=Photo" alt="Teacher Photo">
        </div>
        <div class="teacher-name" id="name">-</div>
        <div class="teacher-badge" id="qualification">-</div>

        <div class="details-list">
            <div class="detail-row">
                <span class="detail-label">Date of Joining</span>
                <span class="detail-value" id="doj">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Mobile Number</span>
                <span class="detail-value" id="mobile">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Blood Group</span>
                <span class="detail-value" id="bloodGroup">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Address</span>
                <span class="detail-value" id="address">-</span>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOlazCzBurIelrL2wyIo_cOeC9jJeRp8I",
      authDomain: "privateid-aa396.firebaseapp.com",
      projectId: "privateid-aa396",
      storageBucket: "privateid-aa396.firebasestorage.app",
      messagingSenderId: "543202127090",
      appId: "1:543202127090:web:a9f2dd69c1c216a769746b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function fetchTeacherProfile() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const statusMsg = document.getElementById('status-msg');
        const profileCard = document.getElementById('profileCard');

        if (!id) {
            statusMsg.innerHTML = "<span style='color:red;'>Error: No Teacher ID provided in the URL.</span>";
            return;
        }

        try {
            const docRef = doc(db, "teachers", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();

                document.getElementById('photo').src = data.photo || 'https://placehold.co/110x110?text=No+Photo';
                document.getElementById('name').innerText = data.name || 'N/A';
                document.getElementById('qualification').innerText = data.qualification || 'Teacher';
                document.getElementById('doj').innerText = data.doj || 'N/A';
                document.getElementById('mobile').innerText = data.mobile || 'N/A';
                document.getElementById('bloodGroup').innerText = data.bloodGroup || 'N/A';
                document.getElementById('address').innerText = data.address || 'N/A';

                statusMsg.style.display = 'none';
                profileCard.style.display = 'block';
            } else {
                statusMsg.innerHTML = "<span style='color:red;'>Teacher record not found.</span>";
            }
        } catch (error) {
            console.error("Error fetching document:", error);
            statusMsg.innerHTML = "<span style='color:red;'>Failed to load teacher profile. Please try again.</span>";
        }
    }

    window.addEventListener('DOMContentLoaded', fetchTeacherProfile);
</script>
</body>
</html>
