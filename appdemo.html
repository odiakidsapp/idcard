        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; }
        
        /* Toast Animations */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit { transform: translateY(0); opacity: 1; }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

    <script>
        // ==========================================
        // NEW UI UTILITIES (Tailwind Toasts, Modals, Share)
        // ==========================================
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = type === 'error' ? 'bg-red-600' : 'bg-gray-900';
            let icon = type === 'error' ? '<i class="fas fa-circle-exclamation text-red-400"></i>' : '<i class="fas fa-check-circle text-green-400"></i>';

            toast.className = `flex items-center gap-3 ${bgClass} text-white px-5 py-3 rounded-xl shadow-xl max-w-sm w-full pointer-events-auto toast-enter`;
            toast.innerHTML = `${icon} <span class="text-sm font-medium leading-snug">${msg}</span>`;
            
            container.appendChild(toast);
            
            // Trigger entry animation
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            // Remove after 3s
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Custom Confirm returning Promise
        function showConfirm(msg) {
            return new Promise(resolve => {
                const modal = document.getElementById('customConfirmModal');
                const box = document.getElementById('confirmBox');
                document.getElementById('confirmMsg').textContent = msg;
                
                modal.classList.remove('hidden');
                setTimeout(() => box.classList.remove('scale-95'), 10);

                const cleanup = () => {
                    box.classList.add('scale-95');
                    setTimeout(() => modal.classList.add('hidden'), 200);
                };

                document.getElementById('confirmOkBtn').onclick = () => { cleanup(); resolve(true); };
                document.getElementById('confirmCancelBtn').onclick = () => { cleanup(); resolve(false); };
            });
        }

        // Replace native alerts globally
        window.alert = function(msg) { showToast(msg, 'error'); };

        // Share API
        async function shareApp() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'AN ID CARDS - Data Entry',
                        text: 'Install this app to collect student ID card data completely offline!',
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('User cancelled share or error:', err);
                }
            } else {
                // Fallback for desktop browsers without Web Share API
                navigator.clipboard.writeText(window.location.href);
                showToast("Link copied to clipboard!", "success");
            }
        }

        // SW Updater Listener
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                document.getElementById('updateBanner').classList.remove('hidden');
            });
        }

        // ==========================================
        // CORE FIREBASE & INDEXEDDB LOGIC (Preserved)
        // ==========================================
        const firebaseConfig = {
              apiKey: "AIzaSyC76wT0RbwuLGbhp0mU7kje25g-xxydLqU",
              authDomain: "idcard-60586.firebaseapp.com",
              projectId: "idcard-60586",
              storageBucket: "idcard-60586.firebasestorage.app",
              messagingSenderId: "331979663377",
              appId: "1:331979663377:web:026e537a7fcaca813129b0",
              measurementId: "G-PXVV87C78S"
        };
        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();

        let db, currentSchool = null, currentSchoolData = null, students = [], currentPhotoBlob = null;
        let visibleCount = 50; // Pagination State
        window.assets = { template: null, fontLoaded: false };

        const req = indexedDB.open('SchoolDataApp', 5);
        req.onupgradeneeded = e => {
            db = e.target.result;
            if(!db.objectStoreNames.contains('schools')) db.createObjectStore('schools', {keyPath:'name'});
            if(!db.objectStoreNames.contains('students')) {
                const st = db.createObjectStore('students', {keyPath:'id'});
                st.createIndex('schoolName', 'schoolName', {unique:false});
            }
        };
        req.onsuccess = e => {
            db = e.target.result;
            loadSchools();
            if (navigator.onLine) {
                syncAllPending();
                const pending = localStorage.getItem('pendingSchoolRename');
                if (pending) {
                    const { oldName, updates } = JSON.parse(pending);
                    pushSchoolRenameToFirestore(oldName, updates);
                }
            }
        };

        const blobToBase64 = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
        });

        function compressImageToDataURL(imgElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_WIDTH = 380; 
                let width = imgElement.width;
                let height = imgElement.height;
                if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(imgElement, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.75));
            });
        }

        function recompressBase64(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(compressImageToDataURL(img));
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        async function loadPreviewAssets() {
            try {
                const f = new FontFace('OdiaFont', await (await fetch('OdiaFont.ttf')).arrayBuffer());
                await f.load(); document.fonts.add(f); window.assets.fontLoaded = true;
            } catch(e) {}
            try {
                const img = new Image();
                img.src = URL.createObjectURL(await (await fetch('background.png')).blob());
                img.onload = () => window.assets.template = img;
            } catch(e) {}
        }
        loadPreviewAssets();

        window.addEventListener('online', () => { syncAllPending(); });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') syncAllPending();
        });

        let isSyncing = false;

        async function syncAllPending() {
            if(!db || !navigator.onLine) return;
            if(isSyncing) return;
            isSyncing = true;
            const btn = document.getElementById('manualSyncBtn');

            const unsyncedIds = [];
            await new Promise((resolve, reject) => {
                const tx = db.transaction(['students'], 'readonly');
                const cursorReq = tx.objectStore('students').openCursor();
                cursorReq.onsuccess = e => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (!cursor.value.synced) unsyncedIds.push(cursor.value.id);
                        cursor.continue();
                    } else resolve();
                };
            });

            if (unsyncedIds.length === 0) {
                if (btn) {
                    btn.innerHTML = "<i class='fas fa-check'></i> All Synced";
                    setTimeout(() => btn.innerHTML = "<i class='fas fa-sync-alt'></i> Sync", 2000);
                }
                isSyncing = false;
                return;
            }

            try {
                let successCount = 0, failCount = 0;
                for (let i = 0; i < unsyncedIds.length; i++) {
                    if (btn) btn.innerHTML = `<i class='fas fa-spinner fa-spin'></i> ${i + 1}/${unsyncedIds.length}`;
                    try {
                        const student = await new Promise((resolve, reject) => {
                            const tx = db.transaction(['students'], 'readonly');
                            const getReq = tx.objectStore('students').get(unsyncedIds[i]);
                            getReq.onsuccess = () => resolve(getReq.result);
                        });
                        if (!student || student.synced) continue; 
                        await syncToFirebase(student);
                        successCount++;

                        if (student.syncError) {
                            delete student.syncError;
                            const tx2 = db.transaction(['students'], 'readwrite');
                            tx2.objectStore('students').put(student);
                        }
                    } catch (err) {
                        failCount++;
                        try {
                            const tx3 = db.transaction(['students'], 'readwrite');
                            const getReq2 = tx3.objectStore('students').get(unsyncedIds[i]);
                            getReq2.onsuccess = () => {
                                const rec = getReq2.result;
                                if (rec) {
                                    rec.syncError = (err && err.message) ? err.message : String(err);
                                    tx3.objectStore('students').put(rec);
                                }
                            };
                        } catch (e2) {}
                    }
                }

                if (btn) {
                    if (failCount === 0) btn.innerHTML = "<i class='fas fa-check'></i> Synced";
                    else btn.innerHTML = `<i class='fas fa-exclamation-triangle'></i> ${failCount} failed`;
                    setTimeout(() => btn.innerHTML = "<i class='fas fa-sync-alt'></i> Sync", 3000);
                }
                loadStudents(); 
            } finally {
                isSyncing = false;
            }
        }

        function performRestore(docs, schoolName, udise, statusEl) {
            const first = docs[0].data;
            const schoolObj = {
                name: schoolName, phone: first.hmPhone || '', block: first.block || '',
                district: first.district || '', pin: first.pin || '', udise: first.udise || udise,
                hmSignature: first.hmSignature || '', createdAt: Date.now()
            };

            statusEl.className = 'text-sm mt-3 font-medium text-brand-600 block';
            statusEl.textContent = `Restoring ${docs.length} student(s)...`;

            const tx = db.transaction(['schools', 'students'], 'readwrite');
            tx.objectStore('schools').put(schoolObj);

            const studentStore = tx.objectStore('students');
            docs.forEach(({ id, data }) => {
                const student = { ...data, id: Number(id), synced: true };
                delete student.submittedAt;
                studentStore.put(student);
            });

            tx.oncomplete = () => {
                showToast(`Restored ${docs.length} students successfully!`);
                setTimeout(() => enterSchool(schoolObj), 800);
            };
            tx.onerror = () => {
                showToast("Failed saving locally.", "error");
                document.getElementById('restoreUdiseBtn').disabled = false;
            };
        }

            const udise = document.getElementById('restoreUdiseInput').value.trim();
            const statusEl = document.getElementById('restoreStatus');
            const btn = document.getElementById('restoreUdiseBtn');

            if (!udise) return alert("Please enter the UDISE Number.");
            if (!/^\d{11}$/.test(udise)) return alert("UDISE must be exactly 11 digits.");
            if (!navigator.onLine) return alert("Internet required to restore data.");

            statusEl.className = 'text-sm mt-3 font-medium text-brand-600 block';
            statusEl.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Searching...";
            btn.disabled = true;

            try {
                const snapshot = await firestore.collection('students').where('udise', '==', udise).get();

                if (snapshot.empty) {
                    statusEl.className = 'text-sm mt-3 font-medium text-red-600 block';
                    statusEl.textContent = "No records found for this UDISE.";
                    btn.disabled = false;
                    return;
                }

                const docs = snapshot.docs.map(d => ({ id: d.id, data: d.data() }));
                const groups = {};
                docs.forEach(d => {
                    const name = d.data.schoolName || '(Unnamed School)';
                    if (!groups[name]) groups[name] = [];
                    groups[name].push(d);
                });
                const distinctNames = Object.keys(groups);

                if (distinctNames.length === 1) {
                    performRestore(docs, distinctNames[0], udise, statusEl);
                    return;
                }

                statusEl.className = 'text-sm mt-3 font-medium text-amber-600 block';
                statusEl.innerHTML = `Found <b>${distinctNames.length} different school names</b>. Please choose one:`;

                const pickerDiv = document.createElement('div');
                pickerDiv.className = "flex flex-col gap-2 mt-3";
                distinctNames.forEach(name => {
                    const optBtn = document.createElement('button');
                    optBtn.className = 'bg-gray-100 hover:bg-gray-200 text-left p-3 rounded-lg text-sm text-gray-800 transition border border-gray-300';
                    optBtn.innerHTML = `<b>${name}</b> <span class="text-gray-500 text-xs block">(${groups[name].length} students)</span>`;
                    optBtn.onclick = () => {
                        pickerDiv.remove();
                        performRestore(groups[name], name, udise, statusEl);

                    pickerDiv.appendChild(optBtn);
                });

            } catch (err) {

                btn.disabled = false;
            }

        async function pushSchoolRenameToFirestore(oldName, updates) {
            if (!navigator.onLine) {
                localStorage.setItem('pendingSchoolRename', JSON.stringify({ oldName, updates }));
                return;
            }
            try {
                const snap = await firestore.collection('students').where('schoolName', '==', oldName).get();
                const docs = snap.docs;
                const chunks = [];
                for (let i = 0; i < docs.length; i += 400) chunks.push(docs.slice(i, i + 400));
                for (const chunk of chunks) {
                    const batch = firestore.batch();
                    chunk.forEach(doc => batch.update(doc.ref, updates));
                    await batch.commit();
                }
                localStorage.removeItem('pendingSchoolRename');
            } catch (err) {
                localStorage.setItem('pendingSchoolRename', JSON.stringify({ oldName, updates }));
            }
        }

        // --- PREVIEW LOGIC ---
        window.odiaDigits = ['୦','୧','୨','୩','୪','୫','୬','୭','୮','୯'];
        function toOdiaDigits(str){ if (str===undefined||str===null) return ''; return (''+str).replace(/\d/g,d=>window.odiaDigits[d]||d); }

        function removeWhiteBg(img) {
            const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
            const cx = c.getContext('2d'); cx.drawImage(img, 0, 0);
            const imgData = cx.getImageData(0,0, c.width, c.height); const d = imgData.data;
            for(let i=0; i<d.length; i+=4) {
                const bright = (d[i]+d[i+1]+d[i+2])/3;
                if(bright > 210) d[i+3] = 0; 
                else if(bright > 150) d[i+3] = Math.max(0, 255 - (bright - 150) * 4);
            }
            cx.putImageData(imgData, 0, 0); return c;
        }

        document.getElementById('previewCardBtn').onclick = async () => {
            if(!window.assets.template || !window.assets.fontLoaded) {
                return alert("Template/Font loading. Please wait or check internet.");
            }

            const name = document.getElementById('sName').value.trim();
            const cls = document.getElementById('sClass').value;
            const roll = document.getElementById('sRoll').value.trim();
            if(!name || !cls || !roll) return alert('Name, Class, and Roll required to preview.');

            let base64 = null;
            if(currentPhotoBlob) base64 = await blobToBase64(currentPhotoBlob);
            else if(id) base64 = students.find(x => x.id == id).photoBase64;
            if (!base64) return alert("Add a photo to preview the card.");

            const CARD_W = 638, CARD_H = 1012;
            const cvs = document.createElement('canvas');
            cvs.width = CARD_W; cvs.height = CARD_H;
            const ctx = cvs.getContext('2d');

            ctx.drawImage(window.assets.template, 0, 0, CARD_W, CARD_H);

            const centerHeadX = 121 + (611 - 121) / 2;
            ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; 
            let fs = 45; ctx.font = `bold ${fs}px OdiaFont`;
            while (ctx.measureText(currentSchoolData.name).width > 490 && fs > 10) { fs--; ctx.font = `bold ${fs}px OdiaFont`; }
            ctx.fillText(currentSchoolData.name, centerHeadX, 55);
            
            ctx.font = '30px OdiaFont'; 
            let addr = [];
            if(currentSchoolData.block) addr.push(currentSchoolData.block);
            if(currentSchoolData.district) addr.push(currentSchoolData.district);
            let addrTxt = addr.join(', ');
            if(currentSchoolData.pin) addrTxt += ' - ' + toOdiaDigits(currentSchoolData.pin);
            ctx.fillText(addrTxt, centerHeadX, 94);

            if(currentSchoolData.udise) {
                ctx.font = '26px OdiaFont'; 
                ctx.fillText('UDISE- ' + toOdiaDigits(currentSchoolData.udise), centerHeadX, 130);
            }

            if(currentSchoolData.hmSignature) {
                const signImg = new Image(); signImg.src = currentSchoolData.hmSignature;
                await new Promise(r => signImg.onload=r);
                const cleanSign = removeWhiteBg(signImg);
                const ratio = Math.min(180 / cleanSign.width, 60 / cleanSign.height);
                ctx.drawImage(cleanSign, 434, 850, cleanSign.width * ratio, cleanSign.height * ratio);
            }

            const photo = new Image(); photo.src = base64;
            await new Promise(r => photo.onload=r);
            const px = 222, py = 250, pw = 187, ph = 225, border = 3;
            ctx.fillStyle = '#000'; ctx.fillRect(px - border, py - border, pw + border*2, ph + border*2);
            const srcRatio = photo.width / photo.height; const destRatio = pw / ph;
            let sx=0, sy=0, sw=photo.width, sh=photo.height;
            if(srcRatio > destRatio) { sw = photo.height * destRatio; sx = (photo.width - sw)/2; } 
            else { sh = photo.width / destRatio; sy = (photo.height - sh)/2; }
            ctx.drawImage(photo, sx, sy, sw, sh, px, py, pw, ph);

            ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.font = `38px OdiaFont`;
            const tx = 227;
            let dob = document.getElementById('sDob').value || '';
            try { const [y,m,d] = dob.split('-'); if(y&&m&&d) dob = `${d}/${m}/${y}`; } catch(e){}
            
            ctx.fillText(name, tx, 543);
            ctx.fillText(toOdiaDigits(cls), tx, 613);
            ctx.fillText(toOdiaDigits(dob), tx, 685);
            ctx.fillText(toOdiaDigits(roll), tx, 756);
            ctx.fillText(toOdiaDigits(document.getElementById('sPhone').value), tx, 827);
            
            const blood = document.getElementById('sBlood').value;
            if(blood){
                ctx.fillStyle = 'white'; ctx.font = `23px OdiaFont`;
                ctx.fillText(blood, 480, 383);
            }

            ctx.save();
            ctx.translate(CARD_W/2, CARD_H/2);
            ctx.rotate(-Math.PI / 4);
            ctx.font = 'bold 70px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const diag = Math.sqrt(CARD_W*CARD_W + CARD_H*CARD_H);
            for(let x = -diag; x <= diag; x += 350) {
                for(let y = -diag; y <= diag; y += 150) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.25)';
                    ctx.fillText('PREVIEW ONLY', x, y);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.fillText('PREVIEW ONLY', x+2, y+2);
                }
            }
            ctx.restore();

            document.getElementById('renderedPreviewImg').src = cvs.toDataURL('image/png');
            document.getElementById('cardPreviewModal').classList.remove('hidden');
        };

        }

        async function deleteStudent(id) {
            const confirmed = await showConfirm("Are you sure you want to delete this student?");
            if(!confirmed) return;
            const tx = db.transaction(['students'], 'readwrite');
            tx.objectStore('students').delete(id);
            tx.oncomplete = () => {
                showToast("Student deleted", "info");
                firestore.collection('students').doc(String(id)).delete().catch(e=>console.log(e));
                loadStudents();
            };
        }

        // Camera Logic
        document.getElementById('openCam').onclick = async () => {
            document.getElementById('cameraModal').classList.remove('hidden');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('cameraVideo').srcObject = stream;
            } catch(e) {
                showToast("Camera access denied or unavailable", "error");
                closeCam();
            }
        };

        document.getElementById('snap').onclick = () => {
            const vid = document.getElementById('cameraVideo');
            if(!vid.videoWidth) return;
            
            const img = new Image();
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = vid.videoWidth; 
            tempCanvas.height = vid.videoHeight;
            tempCanvas.getContext('2d').drawImage(vid, 0, 0);
            
            img.src = tempCanvas.toDataURL('image/jpeg');
            img.onload = async () => {
                const compressedBase64 = await compressImageToDataURL(img);
                document.getElementById('preview').src = compressedBase64;
                document.getElementById('preview').classList.remove('hidden');
                
                const response = await fetch(compressedBase64);
                currentPhotoBlob = await response.blob();
                closeCam();
            };
        };

        function closeCam() {
            const s = document.getElementById('cameraVideo').srcObject;
            if(s) s.getTracks().forEach(t=>t.stop());
            document.getElementById('cameraModal').classList.add('hidden');
        }

        document.getElementById('fileInput').onchange = e => {
            const file = e.target.files[0];
            if (file) {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = async () => {
                    const compressedBase64 = await compressImageToDataURL(img);
                    document.getElementById('preview').src = compressedBase64;
                    document.getElementById('preview').classList.remove('hidden');
                    
                    const response = await fetch(compressedBase64);
                    currentPhotoBlob = await response.blob();
                    URL.revokeObjectURL(img.src);
                };
            }
        };

        const FIRESTORE_SAFE_LIMIT = 900 * 1024;

        async function syncToFirebase(student) {
            try {
                let payloadSize = new Blob([JSON.stringify(student)]).size;
                if (payloadSize > FIRESTORE_SAFE_LIMIT && student.photoBase64) {
                    const shrunk = await recompressBase64(student.photoBase64);
                    student.photoBase64 = shrunk;

                    await new Promise((resolve, reject) => {
                        const tx = db.transaction(['students'], 'readwrite');
                        tx.objectStore('students').put(student);
                        tx.oncomplete = resolve;
                        tx.onerror = reject;
                    });
                }

                await firestore.collection('students').doc(String(student.id)).set(student);

                student.synced = true;
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(['students'], 'readwrite');
                    tx.objectStore('students').put(student);
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
                loadStudents();
            } catch (err) {
                console.error(`Sync failed:`, err);
                throw err;
            }
        }
    </script>
</body>
</html>
