<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel - Premium ID Cards Generator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; padding: 0; margin: 0; background: var(--bg-color); color: var(--text-main); }
    
    /* Header & Navigation */
    .topbar { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 15px 30px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); }
    .topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .global-actions { display: flex; gap: 10px; }

    .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
    
    /* Search Filter */
    .search-wrapper { position: relative; max-width: 600px; margin: 0 auto 30px auto; }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; color: var(--text-muted); pointer-events: none; }
    #searchInput { width: 100%; padding: 14px 16px 14px 48px; border-radius: 12px; border: 1px solid var(--border); font-size: 16px; box-shadow: var(--shadow-sm); outline: none; transition: all 0.2s; box-sizing: border-box; background: var(--surface); color: var(--text-main); }
    #searchInput:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    /* Top Stats Calculator Bar */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 16px; transition: transform 0.2s, box-shadow 0.2s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-icon { font-size: 2rem; background: #e0e7ff; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); }
    .stat-info { display: flex; flex-direction: column; }
    .stat-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }

    /* Buttons */
    button { font-family: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { filter: brightness(1.1); box-shadow: var(--shadow-md); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { filter: brightness(1.1); }
    .btn-warning { background: var(--warning); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
    .btn-outline:hover { background: #f1f5f9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* Setup Card */
    .setup-panel { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; border: 1px solid var(--border); }
    .file-input-wrapper { display: flex; flex-direction: column; gap: 6px; }
    .file-input-wrapper label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type=file], input[type=text], input[type=date], select { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: #f8fafc; transition: border 0.2s; }
    input[type=file]:hover, input[type=text]:focus { border-color: var(--primary); outline: none; }
    .status-badge { background: #e0e7ff; color: var(--primary); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

    /* Class Sections */
    .class-section { margin-bottom: 40px; }
    .class-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .class-header h2 { margin: 0; font-size: 1.5rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .student-count { background: var(--border); color: var(--text-muted); padding: 2px 10px; border-radius: 12px; font-size: 14px; font-weight: 600; }
    .class-actions { display: flex; gap: 10px; align-items: center; }

    /* Student Grid & Cards */
    .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .student-card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: all 0.2s ease; position: relative; display: flex; flex-direction: column; gap: 12px; }
    .student-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: #cbd5e1; }
    .card-top { display: flex; gap: 15px; align-items: flex-start; }
    .student-photo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; background: #f1f5f9; }
    .student-info { flex: 1; overflow: hidden; }
    .student-name { margin: 0 0 4px 0; font-size: 16px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-meta { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.4; }
    .card-checkbox { position: absolute; top: 16px; right: 16px; width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto; }
    .card-actions button { padding: 6px; font-size: 12px; border-radius: 6px; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal-content { background: var(--surface); padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { margin: 0; font-size: 1.25rem; }
    
    /* Duplicate Finder Styles */
    .dup-group { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .dup-group-title { font-size: 13px; font-weight: 700; color: var(--danger); margin-bottom: 10px; text-transform: uppercase; }
    .dup-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 8px; }
    .dup-item:last-child { margin-bottom: 0; }
    
    /* Checkbox Select All Styling */
    .select-all-wrapper { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); background: #f1f5f9; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    .select-all-wrapper input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

    @media(max-width: 768px) {
      .topbar { flex-direction: column; gap: 15px; padding: 15px; }
      .class-header { flex-direction: column; align-items: flex-start; gap: 15px; }
      .student-grid { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="topbar">
    <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Premium ID Cards</h1>
    <div class="global-actions">
      <button class="btn-warning" onclick="findDuplicates()" title="Find duplicate student records">🔍 Find Duplicates</button>
      <button id="masterGenerateBtn" class="btn-success" title="Generate IDs for ALL selected students">🌟 Master Generate Selected</button>
      <button id="refreshBtn" class="btn-outline">🔄 Refresh Data</button>
      <button id="deleteAllBtn" class="btn-danger">🗑️ Wipe DB</button>
    </div>
  </div>

  <div class="container">

    <!-- Global Name Search Filter -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search for a student by name...">
    </div>

    <!-- Total Students Calculator Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-icon">🎓</div>
        <div class="stat-info">
          <span class="stat-label">Total Students</span>
          <span class="stat-value" id="totalStudentsCount">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📚</div>
        <div class="stat-info">
          <span class="stat-label">Total Classes</span>
          <span class="stat-value" id="totalClassesCount">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">☑️</div>
        <div class="stat-info">
          <span class="stat-label">Selected Students</span>
          <span class="stat-value" id="selectedStudentsCount">0</span>
        </div>
      </div>
    </div>
    
    <!-- Setup Panel -->
    <div class="setup-panel">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div class="file-input-wrapper">
          <label>ID Card Layout (.png/.jpg)</label>
          <input id="templateInput" type="file" accept="image/png, image/jpeg">
        </div>
        <div class="file-input-wrapper">
          <label>Odia Font (.ttf)</label>
          <input id="fontInput" type="file" accept=".ttf,.otf">
        </div>
      </div>
      <div class="status-badge" id="generatorStatus">
        ⚙️ Waiting for Assets...
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="classesContainer">
      <div style="text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 1.1rem;">
        <div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>
        Fetching student data securely from server...
      </div>
    </div>

  </div>

  <canvas id="cardCanvas" style="display:none;"></canvas>

  <!-- Modals -->
  <div id="confirmModal" class="modal"><div class="modal-content" style="max-width: 400px; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 10px;">⚠️</div>
    <h3 style="margin-top: 0;">Are you sure?</h3>
    <p id="confirmText" style="color: var(--text-muted); margin-bottom: 25px;">This action cannot be undone.</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="confirmNoBtn" class="btn-outline" style="flex: 1;">Cancel</button>
      <button id="confirmYesBtn" class="btn-danger" style="flex: 1;">Yes, Delete</button>
    </div>
  </div></div>

  <!-- Duplicate Finder Modal -->
  <div id="duplicateModal" class="modal"><div class="modal-content">
    <div class="modal-header">
      <h3>🔍 Duplicate Records Found</h3>
      <button class="btn-outline" onclick="document.getElementById('duplicateModal').style.display='none'" style="padding: 5px 10px;">✕</button>
    </div>
    <div id="duplicateResults"></div>
  </div></div>

  <div id="editModal" class="modal"><div class="modal-content">
    <div class="modal-header">
        <h3>✏️ Edit Student Profile</h3>
    </div>
    <form id="editForm" onsubmit="return false;">
      <input id="editId" type="hidden">
      <div style="display:flex; gap:15px; margin-bottom: 15px;">
        <div class="file-input-wrapper" style="flex:1"><label>Student Name</label><input id="editName" type="text"></div>
        <div class="file-input-wrapper" style="flex:1"><label>Class</label><input id="editClass" type="text"></div>
      </div>
      <div style="display:flex; gap:15px; margin-bottom: 15px;">
        <div class="file-input-wrapper" style="flex:1"><label>Father's Name</label><input id="editFatherName" type="text"></div>
        <div class="file-input-wrapper" style="flex:1"><label>Mother's Name</label><input id="editMotherName" type="text"></div>
      </div>
      <div class="file-input-wrapper" style="margin-bottom: 15px;"><label>Address</label><input id="editAddress" type="text"></div>
      <div style="display:flex; gap:15px; margin-bottom: 15px;">
        <div class="file-input-wrapper" style="flex:1"><label>Date of Birth</label><input id="editDob" type="date"></div>
        <div class="file-input-wrapper" style="flex:1"><label>Phone Number</label><input id="editPhone" type="text"></div>
      </div>
      <div class="file-input-wrapper" style="margin-bottom: 25px;"><label>Blood Group</label>
        <select id="editBlood"><option value="">(Optional)</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="cancelEditBtn" class="btn-outline" style="flex:1;">Cancel</button>
        <button id="saveEditBtn" class="btn-primary" style="flex:1;">Save Changes</button>
      </div>
    </form>
  </div></div>

<script>
/* ---------- Portrait CR80 sizes & layout ---------- */
const DPI = 300;
const CARD_MM_W = 54.0;
const CARD_MM_H = 85.6;
const CARD_W = Math.round((CARD_MM_W / 25.4) * DPI);
const CARD_H = Math.round((CARD_MM_H / 25.4) * DPI);

const A4_W = 3508, A4_H = 2480;
const GRID_COLS = 5, GRID_ROWS = 2;

// =========================================================
// 🛠️ ID CARD LAYOUT CONFIGURATION 🛠️
// =========================================================
const C = {
    photoX: 208, photoY: 347, photoW: 218, photoH: 195,    
    nameX: 317, nameY: 609, nameAlign: 'center', nameColor: '#cc0000', nameFont: 35,         
    detailX: 321, classY: 680, fatherY: 720, motherY: 764, phoneY: 806, dobY: 848, addressY: 890, detailColor: '#02254b', detailFont: 26,
    bloodX: 474, bloodY: 474, bloodColor: '#ffffff', bloodFont: 18,
    showExtra: false, extraX: 420, extraY: 230, extraColor: '#000000', extraFont: 20
};
// =========================================================

/* ---------- Helpers ---------- */
window.odiaDigits = ['୦','୧','୨','୩','୪','୫','୬','୭','୮','୯'];
function toOdiaDigits(str){ if (str===undefined||str===null) return ''; return (''+str).replace(/\d/g,d=>window.odiaDigits[d]||d); }
function escapeHtml(s){ return (s+'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c])); }

/* ---------- DOM ---------- */
const classesContainer = document.getElementById('classesContainer');
const masterGenerateBtn = document.getElementById('masterGenerateBtn');
const refreshBtn = document.getElementById('refreshBtn');
const deleteAllBtn = document.getElementById('deleteAllBtn');
const templateInput = document.getElementById('templateInput');
const fontInput = document.getElementById('fontInput');
const generatorStatus = document.getElementById('generatorStatus');
const searchInput = document.getElementById('searchInput');

const confirmModal = document.getElementById('confirmModal');
const confirmText = document.getElementById('confirmText');
const confirmYesBtn = document.getElementById('confirmYesBtn');
const confirmNoBtn = document.getElementById('confirmNoBtn');

const editModal = document.getElementById('editModal');
const editId = document.getElementById('editId');
const editName = document.getElementById('editName');
const editFatherName = document.getElementById('editFatherName');
const editMotherName = document.getElementById('editMotherName');
const editAddress = document.getElementById('editAddress');
const editClass = document.getElementById('editClass');
const editDob = document.getElementById('editDob');
const editPhone = document.getElementById('editPhone');
const editBlood = document.getElementById('editBlood');
const saveEditBtn = document.getElementById('saveEditBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

const duplicateModal = document.getElementById('duplicateModal');
const duplicateResults = document.getElementById('duplicateResults');

const cardCanvas = document.getElementById('cardCanvas');
const ctx = cardCanvas.getContext('2d');

/* ---------- State ---------- */
let db = null;
let allStudents = [];
let groupedByClass = {};
let idToDelete = null;
let customConfirmCallback = null;
window.assets = { template:null, templateWidth:0, templateHeight:0, font:null, aiModel:'pending', isReady: false };

/* ---------- Firebase init ---------- */
try{
  const firebaseConfig = {
    apiKey: "AIzaSyAOlazCzBurIelrL2wyIo_cOeC9jJeRp8I",
    authDomain: "privateid-aa396.firebaseapp.com",
    projectId: "privateid-aa396",
    storageBucket: "privateid-aa396.firebasestorage.app",
    messagingSenderId: "543202127090",
    appId: "1:543202127090:web:a9f2dd69c1c216a769746b"
  };
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  window.db = db;
  loadData();
} catch(e){ console.error('Firebase init failed', e); classesContainer.innerHTML = `<div style="padding: 20px; color: red;">Firebase init failed: ${escapeHtml(e.message||e)}</div>`; }

/* ---------- Load & Render Data ---------- */
function loadData(){
  classesContainer.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: var(--text-muted);"><div style="font-size: 2rem; margin-bottom: 10px;">⏳</div>Refreshing server data...</div>';
  if(!db) return;
  db.collection('students').get().then(qs=>{
    allStudents = []; 
    qs.forEach(doc=>{ const d=doc.data(); allStudents.push(d); });
    
    // Sort recently added first
    allStudents.sort((a,b)=> (b.submittedAt?.toMillis()||0) - (a.submittedAt?.toMillis()||0));
    window.allStudents = allStudents;
    
    // Group by Class
    groupedByClass = allStudents.reduce((acc, s) => {
      let cName = s.class ? s.class.trim() : 'Unassigned';
      if(cName === '') cName = 'Unassigned';
      if(!acc[cName]) acc[cName] = [];
      acc[cName].push(s);
      return acc;
    }, {});

    renderClassGrids();
    updateGlobalDeleteButton();
    updateStats(); // Update dashboard calculation
    
    // Re-trigger search if there's an active query during reload
    if(searchInput.value) { searchInput.dispatchEvent(new Event('input')); }
  }).catch(err=>{ console.error(err); classesContainer.innerHTML = `<div style="padding: 20px; color: red;">Error: ${escapeHtml(err.message||err)}</div>`; updateGlobalDeleteButton(); });
}

function updateStats() {
    const totalStudents = allStudents.length;
    const totalClasses = Object.keys(groupedByClass).length;
    const selectedCount = document.querySelectorAll('.student-cb:checked').length;
    
    document.getElementById('totalStudentsCount').textContent = totalStudents;
    document.getElementById('totalClassesCount').textContent = totalClasses;
    document.getElementById('selectedStudentsCount').textContent = selectedCount;
}

function renderClassGrids() {
  classesContainer.innerHTML = '';
  
  // Natural sort for classes (e.g. Class 1, Class 2, Class 10)
  const classNames = Object.keys(groupedByClass).sort(new Intl.Collator('en', {numeric: true, sensitivity: 'base'}).compare);
  
  if(classNames.length === 0) {
    classesContainer.innerHTML = '<div style="text-align: center; padding: 60px 20px; background: white; border-radius: 12px; color: var(--text-muted);">No student records found in the database.</div>';
    return;
  }

  classNames.forEach((className) => {
    const students = groupedByClass[className];
    const safeId = escapeHtml(className);

    const section = document.createElement('div');
    section.className = 'class-section';
    
    let cardsHtml = '';
    students.forEach(s => {
      const photoSrc = s.photoBase64 || 'https://placehold.co/150?text=No+Photo';
      cardsHtml += `
        <div class="student-card">
          <input type="checkbox" class="card-checkbox student-cb" data-class="${safeId}" value="${s.id}">
          <div class="card-top">
            <img class="student-photo" src="${photoSrc}" onclick="window.open('${photoSrc}')" title="View Full Image">
            <div class="student-info">
              <h4 class="student-name" title="${escapeHtml(s.name||'')}">${escapeHtml(s.name||'')}</h4>
              <p class="student-meta"><strong>F:</strong> ${escapeHtml(s.fatherName||'-')}<br>
              <strong>📞</strong> ${escapeHtml(s.phone||'-')}<br>
              <strong>🎂</strong> ${escapeHtml(s.dob||'-')}</p>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn-primary generate-btn" data-id="${s.id}" title="Generate Card">🖨️ Card</button>
            <button class="btn-outline edit-btn" data-id="${s.id}">✏️ Edit</button> 
            <button class="btn-outline delete-btn" data-id="${s.id}" data-name="${escapeHtml(s.name||'student')}" style="color: var(--danger); border-color: #fee2e2; background: #fef2f2;">🗑️</button>
          </div>
        </div>
      `;
    });

    section.innerHTML = `
      <div class="class-header">
        <h2>📚 Class: ${escapeHtml(className)} <span class="student-count" data-total="${students.length}">${students.length}</span></h2>
        <div class="class-actions">
            <label class="select-all-wrapper">
                <input type="checkbox" class="select-all-cb" data-class="${safeId}"> Select All
            </label>
            <button class="btn-success generate-selected-btn" data-class="${safeId}">🖨️ Print Class IDs</button>
            <button class="btn-warning export-raw-btn" data-class="${safeId}">💾 Backup Raw</button>
        </div>
      </div>
      <div class="student-grid">
        ${cardsHtml}
      </div>
    `;
    classesContainer.appendChild(section);
  });
}

/* ---------- Live Search Filter ---------- */

/* ---------- Duplicate Finder ---------- */
function findDuplicates() {
    let dupMap = {};
    let potentialDuplicates = [];

    // Group logic: Match exact (lowercase, trimmed) Name + Father Name, OR Phone number (if exists)
    allStudents.forEach(s => {
        let nameKey = `${(s.name||'').trim().toLowerCase()}|${(s.fatherName||'').trim().toLowerCase()}`;
        let phoneKey = (s.phone||'').trim();

        if(nameKey !== "|") {
            if(!dupMap[nameKey]) dupMap[nameKey] = [];
            dupMap[nameKey].push(s);
        }
        
        // Also check by phone if it's substantial enough to be a real number
        if(phoneKey.length > 5) {
            let pKey = `phone:${phoneKey}`;
            if(!dupMap[pKey]) dupMap[pKey] = [];
            if(!dupMap[pKey].find(existing => existing.id === s.id)) { // Avoid double-adding if name already matched
                dupMap[pKey].push(s);
            }
        }
    });

    Object.keys(dupMap).forEach(key => {
        if(dupMap[key].length > 1) {
            let reason = key.startsWith('phone:') ? `Shared Phone: ${key.split(':')[1]}` : `Shared Name & Father: ${key.replace('|', ' / ')}`;
            potentialDuplicates.push({ reason, records: dupMap[key] });
        }
    });

    duplicateResults.innerHTML = '';
    
    if(potentialDuplicates.length === 0) {
        duplicateResults.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--success); font-weight: bold; background: #ecfdf5; border-radius: 8px;">✅ No duplicate records found! Your database is clean.</div>';
    } else {
        potentialDuplicates.forEach(group => {
            let groupHtml = `<div class="dup-group"><div class="dup-group-title">⚠️ Match: ${escapeHtml(group.reason)}</div>`;
            group.records.forEach(r => {
                groupHtml += `
                    <div class="dup-item">
                        <div>
                            <strong>${escapeHtml(r.name)}</strong> (Class: ${escapeHtml(r.class||'-')})<br>
                            <small style="color: var(--text-muted)">Father: ${escapeHtml(r.fatherName||'-')} | Phone: ${escapeHtml(r.phone||'-')}</small>
                        </div>
                        <button class="btn-danger" style="padding: 6px 12px; font-size: 12px;" onclick="quickDelete('${r.id}')">Delete</button>
                    </div>
                `;
            });
            groupHtml += `</div>`;
            duplicateResults.innerHTML += groupHtml;
        });
    }

    duplicateModal.style.display = 'flex';
}

/* ---------- Single Card Rendering ---------- */
async function generateCardImage(student){
  cardCanvas.width = CARD_W; cardCanvas.height = CARD_H;
  ctx.clearRect(0,0,CARD_W,CARD_H);

  const scale = CARD_W / (window.assets.templateWidth || CARD_W);
  if(window.assets.template) ctx.drawImage(window.assets.template, 0, 0, CARD_W, CARD_H); else { ctx.fillStyle='#fff'; ctx.fillRect(0,0,CARD_W,CARD_H); }

  const px = Math.round(C.photoX * scale), py = Math.round(C.photoY * scale), pw = Math.round(C.photoW * scale), ph = Math.round(C.photoH * scale);
  const border = Math.max(2, Math.round(3 * scale));
  ctx.fillStyle = '#000'; ctx.fillRect(px - border, py - border, pw + border*2, ph + border*2);

  const photo = new Image(); let photoLoaded = false;
  if(student.photoBase64){ photo.src = student.photoBase64; await new Promise((r,rej)=>{ photo.onload = ()=>{ photoLoaded=true; r(); }; photo.onerror = rej; }); }

  let sx=0, sy=0, sW = photo.width || 1, sH = photo.height || 1;
  const targetRatio = pw / ph;

  if (photoLoaded) {
    let srcW = photo.width, srcH = photo.height, srcRatio = srcW / srcH, useFallbackCrop = true;
    if (faceDetector && window.assets.aiModel === 'loaded') {
      try {
        const det = faceDetector.detect(photo);
        if (det && det.detections && det.detections.length > 0) {
          const b = det.detections[0].boundingBox, ax = b.width * 0.6, ay = b.height * 1.4;
          sx = Math.max(0, b.originX - ax / 2); sy = Math.max(0, b.originY - ay / 2);
          sW = Math.min(srcW - sx, b.width + ax); sH = Math.min(srcH - sy, b.height + ay);
          useFallbackCrop = false;
        }
      } catch (e) {}
    }
    if (useFallbackCrop) {
        if (srcRatio > targetRatio) { sH = srcH; sW = sH * targetRatio; sx = (srcW - sW) / 2; sy = 0; } 
        else { sW = srcW; sH = sW / targetRatio; sx = 0; sy = (srcH - sH) / 2; }
    }
  }

  if(photoLoaded) ctx.drawImage(photo, sx, sy, sW, sH, px, py, pw, ph); else { ctx.fillStyle = '#fff'; ctx.fillRect(px, py, pw, ph); }

  ctx.textAlign = C.nameAlign; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = C.nameColor;
  ctx.font = `bold ${Math.round(C.nameFont * scale)}px OdiaFont, sans-serif`;
  ctx.fillText(student.name || '', Math.round(C.nameX * scale), Math.round(C.nameY * scale));

  ctx.textAlign = 'left'; ctx.fillStyle = C.detailColor; ctx.font = `${Math.round(C.detailFont * scale)}px OdiaFont, sans-serif`;
  const dX = Math.round(C.detailX * scale);
  ctx.fillText(student.class || '-', dX, Math.round(C.classY * scale));
  ctx.fillText(student.fatherName || '-', dX, Math.round(C.fatherY * scale));
  ctx.fillText(student.motherName || '-', dX, Math.round(C.motherY * scale));
  ctx.fillText(toOdiaDigits(student.phone || '-'), dX, Math.round(C.phoneY * scale));
  
  let dobFormatted = student.dob || '-'; try{ const [y,m,d] = dobFormatted.split('-'); if(y&&m&&d) dobFormatted = `${d}/${m}/${y}`; } catch(e){}
  ctx.fillText(toOdiaDigits(dobFormatted), dX, Math.round(C.dobY * scale));
  ctx.fillText(student.address || '-', dX, Math.round(C.addressY * scale));

  if (student.bloodGroup) {
      ctx.fillStyle = C.bloodColor; ctx.font = `bold ${Math.round(C.bloodFont * scale)}px OdiaFont, sans-serif`;
      ctx.fillText(student.bloodGroup, Math.round(C.bloodX * scale), Math.round(C.bloodY * scale));
  }
  return await new Promise(res => cardCanvas.toBlob(res,'image/png'));
}

    const ws = XLSX.utils.json_to_sheet(excelData); const wb = XLSX.utils.book_new();
    const cleanSheetName = sheetName.replace(/[\\\/\?\*\[\]:]/g,'').substring(0,31) || 'Data';
    XLSX.utils.book_append_sheet(wb, ws, cleanSheetName);
    zip.file('student_data.xlsx', XLSX.write(wb, { bookType:'xlsx', type:'array' }));

    const zipBlob = await zip.generateAsync({ type:'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(zipBlob); a.download = `${cleanSheetName}_IDs.zip`; a.click();

/* ---------- PDF & A4 Helpers ---------- */
async function createA4Pages(singleImages){
    const pages = []; const pageCanvas = document.createElement('canvas'); 
    pageCanvas.width = A4_W; pageCanvas.height = A4_H; const pctx = pageCanvas.getContext('2d');
    const GAP_X = 40, GAP_Y = 150;
    const startX = (A4_W - ((5 * CARD_W) + (4 * GAP_X))) / 2;
    const startY = (A4_H - ((2 * CARD_H) + (1 * GAP_Y))) / 2;

    for (let i = 0; i < singleImages.length; i += 10) {
        pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, A4_W, A4_H);
        const chunk = singleImages.slice(i, i + 10);
        chunk.forEach((item, idx) => {
            const c = idx % 5, r = Math.floor(idx / 5);
            const x = startX + c * (CARD_W + GAP_X), y = startY + r * (CARD_H + GAP_Y);
            pctx.drawImage(item.img, x, y, CARD_W, CARD_H);
            pctx.strokeStyle = '#ccc'; pctx.lineWidth = 2; pctx.strokeRect(x, y, CARD_W, CARD_H);
        });
        pages.push(await new Promise(res => pageCanvas.toBlob(res, 'image/png'))); pctx.clearRect(0, 0, A4_W, A4_H);
    }
    return pages;
}

async function createCombinedPdf(singleImages){
  const mod = await ensureJsPDF(); const jsPDF = mod.jsPDF; const pdf = new jsPDF({ unit:'px', format:[CARD_W, CARD_H] }); 
  let first = true;
  for(const item of singleImages){
    const tmp = document.createElement('canvas'); tmp.width = CARD_W; tmp.height = CARD_H;
    const tctx = tmp.getContext('2d'); tctx.drawImage(item.img, 0, 0, CARD_W, CARD_H);
    const wm = 'AN DIGITAL'; tctx.globalAlpha = 0.12; tctx.fillStyle = '#000';
    const fontSize = Math.round(Math.min(CARD_W, CARD_H) * 0.075);
    tctx.font = `${fontSize}px sans-serif`; tctx.textAlign='center'; tctx.textBaseline='middle';
    const spacingX = Math.round(fontSize * 4.0), spacingY = Math.round(fontSize * 3.0);
    tctx.save(); tctx.translate(CARD_W/2, CARD_H/2); tctx.rotate(-Math.PI/10);
    const cols = Math.ceil(CARD_W / spacingX) + 2, rows = Math.ceil(CARD_H / spacingY) + 2;
    const sX = - (cols/2) * spacingX, sY = - (rows/2) * spacingY;
    for(let r=0;r<rows;r++){ for(let c=0;c<cols;c++){ tctx.fillText(wm, sX + c*spacingX, sY + r*spacingY); } }
    tctx.restore(); tctx.globalAlpha = 1;

    if (!first) pdf.addPage([CARD_W, CARD_H], 'portrait');
    pdf.addImage(tmp.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, CARD_W, CARD_H); first = false;
  }
  return pdf;
}

function blobToArrayBuffer(b){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsArrayBuffer(b); }); }
function updateGlobalDeleteButton(){ try{ deleteAllBtn.disabled = !(Array.isArray(window.allStudents) && window.allStudents.length>0); }catch(e){ deleteAllBtn.disabled=true; } }
</script>
