<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS Student Portal Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Toast animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </div>
                    <h1 class="text-xl font-bold text-gray-900">Student Editor Hub</h1>
                </div>
                <div>
                    <label for="excel-upload" class="cursor-pointer bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-medium text-sm transition shadow-sm inline-flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Import Excel Data
                    </label>
                    <input type="file" id="excel-upload" accept=".xlsx, .xls" class="hidden" />
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Loading State for Initial Fetch -->
        <div id="global-loader" class="flex flex-col items-center justify-center py-20">
            <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-gray-500 font-medium">Connecting to Firebase...</p>
        </div>

        <!-- Empty State (No Data) -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="bg-gray-100 p-6 rounded-full mb-4">
                <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">No Students Found</h2>
            <p class="text-gray-500 max-w-md">Your <code>portal_students</code> collection is empty. Click "Import Excel Data" in the top right to upload your generated Excel sheet.</p>
        </div>

        <!-- Student Grid -->
        <div id="student-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected via JS -->
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // User's exact provided configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC76wT0RbwuLGbhp0mU7kje25g-xxydLqU",
            authDomain: "idcard-60586.firebaseapp.com",
            projectId: "idcard-60586",
            storageBucket: "idcard-60586.firebasestorage.app",
            messagingSenderId: "331979663377",
            appId: "1:331979663377:web:026e537a7fcaca813129b0",
            measurementId: "G-PXVV87C78S"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // UI Elements
        const excelUpload = document.getElementById('excel-upload');
        const grid = document.getElementById('student-grid');
        const globalLoader = document.getElementById('global-loader');
        const emptyState = document.getElementById('empty-state');
        const toastContainer = document.getElementById('toast-container');

        let studentsList = [];

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            toast.className = `toast-animate ${colorClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium`;
            toast.innerHTML = `
                ${type === 'success' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' 
                                     : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>'}
                ${message}
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function listenToStudents() {
            // Using portal_students as requested to align with existing security rules
            const studentsRef = collection(db, 'portal_students');
            
            onSnapshot(studentsRef, (snapshot) => {
                studentsList = [];
                snapshot.forEach((doc) => {
                    // Only pull documents that look like our imported data (has Name and Roll No)
                    const data = doc.data();
                    if(data["Name"]) {
                        studentsList.push({ id: doc.id, ...data });
                    }
                });
                
                globalLoader.classList.add('hidden');
                
                if (studentsList.length === 0) {
                    emptyState.classList.remove('hidden');
                    grid.classList.add('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    grid.classList.remove('hidden');
                    renderGrid();
                }
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                globalLoader.classList.add('hidden');
                showToast("Failed to connect to Database. Check rules.", "error");
            });
        }

        function renderGrid() {
            grid.innerHTML = '';
            
            studentsList.forEach(student => {
                const safeImage = student["Photo Link"] && student["Photo Link"] !== "No Photo Link" ? student["Photo Link"] : "https://placehold.co/150x150/e2e8f0/475569?text=No+Photo";
                const docId = student.id;

                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col transition hover:shadow-md";
                card.innerHTML = `
                    <div class="p-5 flex gap-4 items-start border-b border-gray-100 bg-gray-50/50">
                        <div class="relative group shrink-0">
                            <img src="${safeImage}" id="img-${docId}" alt="${student["Name"]}" class="w-20 h-24 object-cover rounded-md border border-gray-300 shadow-sm bg-white">
                            <div class="absolute inset-0 bg-black/50 rounded-md opacity-0 group-hover:opacity-100 flex items-center justify-center transition cursor-pointer" onclick="document.getElementById('file-${docId}').click()">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            </div>
                            <input type="file" id="file-${docId}" accept="image/*" class="hidden" onchange="window.handlePhotoUpload('${docId}', event)">
                            <div id="loader-${docId}" class="hidden absolute inset-0 bg-white/80 rounded-md flex flex-col items-center justify-center">
                                <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <span class="text-[10px] font-bold mt-1 text-blue-700" id="progress-${docId}">0%</span>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0 pt-1">
                            <h3 class="font-bold text-gray-900 truncate" title="${student["Name"]}">${student["Name"] || "Unknown"}</h3>
                            <p class="text-sm text-gray-500 font-medium">${student["Roll No."] || "No Roll No."}</p>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 mt-2">
                                ${student["Stream"] || "Stream"}
                            </span>
                        </div>
                    </div>
                    
                    <div class="p-5 flex-1 space-y-3">
                        ${createInputField('Name', student['Name'], docId)}
                        <div class="grid grid-cols-2 gap-3">
                            ${createInputField('Roll No.', student['Roll No.'], docId)}
                            ${createInputField('Class', student['Class'], docId)}
                            ${createInputField('Session', student['Session'], docId)}
                            ${createInputField('Stream', student['Stream'], docId)}
                            ${createInputField('Blood Group', student['Blood Group'], docId)}
                            ${createInputField('DOB', student['DOB'], docId)}
                        </div>
                        ${createInputField('Contact No.', student['Contact No.'], docId)}
                    </div>
                    
                    <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 mt-auto">
                        <button onclick="window.saveStudentDetails('${docId}')" id="btn-save-${docId}" class="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-4 py-2 text-center transition shadow-sm flex items-center justify-center gap-2">
                            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Save Changes
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Helper function for creating standard text inputs
        function createInputField(label, value, docId) {
            // Generate a safe ID for HTML targeting
            const safeLabel = label.replace(/[^a-zA-Z0-9]/g, '');
            return `
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">${label}</label>
                    <input type="text" id="input-${safeLabel}-${docId}" value="${value || ''}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 block w-full p-2 transition">
                </div>
            `;
        }

        window.handlePhotoUpload = function(docId, event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate against the user's 1MB rule strictly
            if (file.size > 1 * 1024 * 1024) {
                showToast("File is too large. Max size is 1MB.", "error");
                event.target.value = '';
                return;
            }

            const loader = document.getElementById(`loader-${docId}`);
            const progressTxt = document.getElementById(`progress-${docId}`);
            loader.classList.remove('hidden');

            // Constructing path precisely to match user's rules: /student_photos/{filename}
            const fileExt = file.name.split('.').pop();
            const safeFileName = `${docId}_${Date.now()}.${fileExt}`;
            const storageRef = ref(storage, `student_photos/${safeFileName}`);
            
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressTxt.innerText = Math.round(progress) + '%';
                }, 
                (error) => {
                    console.error("Upload Error:", error);
                    loader.classList.add('hidden');
                    showToast("Photo upload failed. Check rules.", "error");
                }, 
                () => {
                    getDownloadURL(uploadTask.snapshot.ref).then((downloadURL) => {
                        // Update Firestore with the new image link
                        updateDoc(doc(db, "portal_students", docId), {
                            "Photo Link": downloadURL
                        }).then(() => {
                            loader.classList.add('hidden');
                            document.getElementById(`img-${docId}`).src = downloadURL;
                            showToast("Photo updated successfully!");
                        }).catch((err) => {
                            loader.classList.add('hidden');
                            showToast("Failed to save URL to database.", "error");
                            console.error(err);
                        });
                    });
                }
            );
        }

        window.saveStudentDetails = async function(docId) {
            const btn = document.getElementById(`btn-save-${docId}`);
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Saving...`;
            btn.disabled = true;

            const safeId = (label) => label.replace(/[^a-zA-Z0-9]/g, '');
            
            const updatedData = {
                "Name": document.getElementById(`input-${safeId('Name')}-${docId}`).value,
                "Roll No.": document.getElementById(`input-${safeId('Roll No.')}-${docId}`).value,
                "Class": document.getElementById(`input-${safeId('Class')}-${docId}`).value,
                "Session": document.getElementById(`input-${safeId('Session')}-${docId}`).value,
                "Stream": document.getElementById(`input-${safeId('Stream')}-${docId}`).value,
                "Blood Group": document.getElementById(`input-${safeId('Blood Group')}-${docId}`).value,
                "DOB": document.getElementById(`input-${safeId('DOB')}-${docId}`).value,
                "Contact No.": document.getElementById(`input-${safeId('Contact No.')}-${docId}`).value,
            };

            try {
                await updateDoc(doc(db, "portal_students", docId), updatedData);
                showToast("Details updated successfully!");
            } catch (error) {
                console.error("Save Error:", error);
                showToast("Failed to update details.", "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        excelUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showToast("Parsing Excel file...", "success");
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonStudents = XLSX.utils.sheet_to_json(worksheet);

                    if(jsonStudents.length === 0) {
                        showToast("Excel file is empty", "error");
                        return;
                    }

                    showToast(`Importing ${jsonStudents.length} students...`, "success");
                    
                    // Upload to Firebase using WriteBatch for performance
                    const batch = writeBatch(db);
                    let count = 0;

                    jsonStudents.forEach((student) => {
                        // Use Roll Number as document ID if available to prevent duplicates.
                        // Fallback to random ID if missing.
                        let docId = student["Roll No."] ? student["Roll No."].replace(/[^a-zA-Z0-9-]/g, '') : null;
                        
                        let docRef;
                        if (docId) {
                            docRef = doc(db, "portal_students", docId);
                        } else {
                            docRef = doc(collection(db, "portal_students"));
                        }
                        
                        // Set the document (merging so it doesn't delete existing data if re-imported)
                        batch.set(docRef, {
                            ...student,
                            importedAt: new Date().toISOString()
                        }, { merge: true });

                        count++;
                    });

                    await batch.commit();
                    showToast(`Successfully imported ${count} students!`, "success");
                    excelUpload.value = ''; // Reset input

                } catch (error) {
                    console.error("Import Error:", error);
                    showToast("Error processing Excel file.", "error");
                }
            };
            
            reader.readAsArrayBuffer(file);
        });

        // Initialize App
        listenToStudents();

    </script>
</body>
</html>
