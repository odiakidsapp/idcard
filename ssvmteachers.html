<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Teachers</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .admin-container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .photo-cell img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        #loading { text-align: center; font-size: 18px; color: #666; margin-top: 20px; }

        /* Button Styles */
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; margin-bottom: 3px; }
        .edit-btn { background-color: #ffc107; color: #000; }
        .edit-btn:hover { background-color: #e0a800; }
        .delete-btn { background-color: #dc3545; color: white; }
        .delete-btn:hover { background-color: #c82333; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .save-btn { background-color: #28a745; color: white; padding: 8px 15px; }
        .cancel-btn { background-color: #6c757d; color: white; padding: 8px 15px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Manage Registered Teachers</h2>
    <div id="loading">Loading data from Firestore...</div>
    <table id="teachersTable" style="display:none;">
        <thead>
            <tr>
                <th>#</th>
                <th>Photo</th>
                <th>Name</th>
                <th>Designation</th>
                <th>Date of Joining</th>
                <th>Qualification</th>
                <th>Mobile</th>
                <th>Blood Group</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will be injected here -->
        </tbody>
    </table>
</div>

<!-- Edit Teacher Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3>Edit Teacher Details</h3>
        <form id="editForm">
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Title / Prefix</label>
                <select id="edit-salutation" required>
                    <option value="ଶ୍ରୀଯୁକ୍ତ">ଶ୍ରୀଯୁକ୍ତ</option>
                    <option value="ଶ୍ରୀମାନ">ଶ୍ରୀମାନ</option>
                    <option value="ସୁଶ୍ରୀ">ସୁଶ୍ରୀ</option>
                    <option value="ଶ୍ରୀମତୀ">ଶ୍ରୀମତୀ</option>
                </select>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="form-group">
                <label>Designation</label>
                <input type="text" id="edit-designation" required>
            </div>
            <div class="form-group">
                <label>Date of Joining</label>
                <input type="date" id="edit-doj" required>
            </div>
            <div class="form-group">
                <label>Qualification</label>
                <input type="text" id="edit-qualification" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="edit-mobile" required>
            </div>
            <div class="form-group">
                <label>Blood Group</label>
                <select id="edit-bloodGroup" required>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="edit-address" rows="3" required></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="closeModalBtn">Cancel</button>
                <button type="submit" class="save-btn" id="saveChangesBtn">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOlazCzBurIelrL2wyIo_cOeC9jJeRp8I",
      authDomain: "privateid-aa396.firebaseapp.com",
      projectId: "privateid-aa396",
      storageBucket: "privateid-aa396.firebasestorage.app",
      messagingSenderId: "543202127090",
      appId: "1:543202127090:web:a9f2dd69c1c216a769746b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let teachersDataMap = {};

    async function loadData() {
        const tableBody = document.getElementById('tableBody');
        const loading = document.getElementById('loading');
        const table = document.getElementById('teachersTable');

        loading.style.display = 'block';
        table.style.display = 'none';
        
        try {
            const q = query(collection(db, "teachers"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            
            tableBody.innerHTML = ''; 
            teachersDataMap = {}; 
            
            let serialNumber = 1;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                
                teachersDataMap[id] = data;

                const tr = document.createElement('tr');
                const imgSrc = data.photo ? data.photo : 'https://placehold.co/50x50?text=No+Img';
                const fullName = (data.salutation ? data.salutation + ' ' : '') + (data.name || '');
                
                tr.innerHTML = `
                    <td><b>${serialNumber}</b></td>
                    <td class="photo-cell"><img src="${imgSrc}" alt="Profile"></td>
                    <td>${fullName}</td>
                    <td>${data.designation || ''}</td>
                    <td>${data.doj || ''}</td>
                    <td>${data.qualification || ''}</td>
                    <td>${data.mobile || ''}</td>
                    <td>${data.bloodGroup || ''}</td>
                    <td>${data.address || ''}</td>
                    <td>
                        <button class="edit-btn" data-id="${id}">Edit</button>
                        <button class="delete-btn" data-id="${id}">Delete</button>
                    </td>
                `;
                tableBody.appendChild(tr);
                
                serialNumber++;
            });

            loading.style.display = 'none';
            table.style.display = 'table';
            
        } catch (error) {
            console.error("Error getting documents: ", error);
            loading.innerText = "Error loading data. Check console.";
            loading.style.color = 'red';
        }
    }

    document.getElementById('tableBody').addEventListener('click', async (e) => {
        // DELETE BUTTON
        if (e.target.classList.contains('delete-btn')) {
            const id = e.target.getAttribute('data-id');
            const confirmDelete = confirm("Are you sure you want to delete this teacher's data?");
            
            if (confirmDelete) {
                e.target.innerText = "Deleting...";
                try {
                    await deleteDoc(doc(db, "teachers", id));
                    loadData(); 
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    alert("Failed to delete document.");
                    e.target.innerText = "Delete";
                }
            }
        }

        // EDIT BUTTON
        if (e.target.classList.contains('edit-btn')) {
            const id = e.target.getAttribute('data-id');
            const data = teachersDataMap[id];

            document.getElementById('edit-id').value = id;
            document.getElementById('edit-salutation').value = data.salutation || 'ଶ୍ରୀଯୁକ୍ତ';
            document.getElementById('edit-name').value = data.name || '';
            document.getElementById('edit-designation').value = data.designation || '';
            document.getElementById('edit-doj').value = data.doj || '';
            document.getElementById('edit-qualification').value = data.qualification || '';
            document.getElementById('edit-mobile').value = data.mobile || '';
            document.getElementById('edit-bloodGroup').value = data.bloodGroup || 'A+';
            document.getElementById('edit-address').value = data.address || '';

            document.getElementById('editModal').style.display = 'flex';
        }
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('editModal').style.display = 'none';
    });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveChangesBtn');
        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        const id = document.getElementById('edit-id').value;
        
        const updatedData = {
            salutation: document.getElementById('edit-salutation').value,
            name: document.getElementById('edit-name').value,
            designation: document.getElementById('edit-designation').value,
            doj: document.getElementById('edit-doj').value,
            qualification: document.getElementById('edit-qualification').value,
            mobile: document.getElementById('edit-mobile').value,
            bloodGroup: document.getElementById('edit-bloodGroup').value,
            address: document.getElementById('edit-address').value,
        };

        try {
            await updateDoc(doc(db, "teachers", id), updatedData);
            document.getElementById('editModal').style.display = 'none';
            loadData(); 
        } catch (error) {
            console.error("Error updating document: ", error);
            alert("Failed to save changes.");
        } finally {
            saveBtn.innerText = "Save Changes";
            saveBtn.disabled = false;
        }
    });

    window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
