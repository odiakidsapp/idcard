<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher ID Card Data Entry</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Cropper.js CSS for Gallery Uploads -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* --- Gallery Cropper Custom Styles --- */
        .cropper-container {
            width: 100% !important;
            height: 100% !important;
        }
        .cropper-view-box {
            border-radius: 4px;
            outline: 2px solid #3b82f6; 
        }
        .cropper-face::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0; /* Touches edges */
            /* Enriched SVG: Head is larger, Shoulders stretch to X=0 and X=100 edges */
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 133'%3E%3Cellipse cx='50' cy='45' rx='26' ry='34' fill='none' stroke='rgba(255,255,255,0.8)' stroke-width='1.5' stroke-dasharray='4,4' /%3E%3Cpath d='M 0 133 C 0 100 10 90 28 83 C 35 91 65 91 72 83 C 90 90 100 100 100 133' fill='none' stroke='rgba(255,255,255,0.8)' stroke-width='1.5' stroke-dasharray='4,4' /%3E%3C/svg%3E");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none; 
        }

        /* --- Live Camera Custom Styles --- */
        #liveVideo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fill the screen */
        }
        .camera-overlay-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }
        .camera-guide-box {
            width: 70vw; /* 70% of screen width */
            max-width: 320px;
            aspect-ratio: 1 / 1; /* SQUARE RATIO */
            border: 2px solid #3b82f6;
            border-radius: 4px;
            /* Darken outside area */
            outline: 4000px solid rgba(0, 0, 0, 0.75); 
            position: relative;
        }
        .camera-guide-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Same larger SVG for live camera */
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 133'%3E%3Cellipse cx='50' cy='45' rx='26' ry='34' fill='none' stroke='rgba(255,255,255,0.8)' stroke-width='1.5' stroke-dasharray='4,4' /%3E%3Cpath d='M 0 133 C 0 100 10 90 28 83 C 35 91 65 91 72 83 C 90 90 100 100 100 133' fill='none' stroke='rgba(255,255,255,0.8)' stroke-width='1.5' stroke-dasharray='4,4' /%3E%3C/svg%3E");
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <nav class="bg-blue-600 shadow-lg text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
                    </svg>
                    <span class="font-bold text-xl tracking-wider">Teacher ID Portal</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto py-8 px-4 sm:px-6">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-800">Teacher Information Form</h2>
                <p class="text-sm text-gray-500 mt-1">Please fill out all the required details to generate your ID card.</p>
            </div>
            
            <form id="teacherForm" class="p-6 space-y-6">
                <!-- Location Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">School Name <span class="text-red-500">*</span></label>
                        <input type="text" id="schoolName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">UDISE Code <span class="text-red-500">*</span></label>
                        <input type="text" id="udiseCode" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Block <span class="text-red-500">*</span></label>
                        <input type="text" id="block" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">District <span class="text-red-500">*</span></label>
                        <input type="text" id="district" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">PIN Code <span class="text-red-500">*</span></label>
                        <input type="text" id="pin" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <hr class="border-gray-200">

                <!-- Personal Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Teacher Full Name <span class="text-red-500">*</span></label>
                        <input type="text" id="teacherName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Designation <span class="text-red-500">*</span></label>
                        <input type="text" id="designation" required placeholder="e.g., Assistant Teacher, Headmaster" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Qualification <span class="text-red-500">*</span></label>
                        <input type="text" id="qualification" required placeholder="e.g., B.Ed, M.A." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number <span class="text-red-500">*</span></label>
                        <input type="tel" id="mobileNo" required pattern="[0-9]{10}" placeholder="10 digit number" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Blood Group <span class="text-red-500">*</span></label>
                        <select id="bloodGroup" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 bg-white">
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Teacher Code <span class="text-gray-400 font-normal">(Optional)</span></label>
                        <input type="text" id="teacherCode" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <hr class="border-gray-200">

                <!-- Photo Upload Section -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teacher Photo <span class="text-red-500">*</span></label>
                    
                    <!-- Upload Buttons UI -->
                    <div id="photoUploadUI" class="mt-1 flex flex-col items-center justify-center px-6 pt-6 pb-6 border-2 border-gray-300 border-dashed rounded-lg bg-gray-50 transition-all hover:bg-gray-100">
                        <p class="text-sm text-gray-600 mb-4 font-medium">Capture live photo or select from gallery</p>
                        
                        <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4 mb-3 w-full sm:w-auto">
                            <!-- Custom Live Camera Button -->
                            <button type="button" onclick="startLiveCamera()" class="flex items-center justify-center px-6 py-3 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition shadow-sm w-full sm:w-auto">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                Open Camera
                            </button>
                            
                            <!-- Gallery Button -->
                            <button type="button" onclick="document.getElementById('photoGallery').click()" class="flex items-center justify-center px-6 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition shadow-sm w-full sm:w-auto">
                                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                Choose Gallery
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-2">Automatically formatted as a Square (1:1)</p>
                        
                        <!-- Hidden File Input for Gallery Only -->
                        <input id="photoGallery" type="file" class="hidden" accept="image/*" onchange="openGalleryCropper(event)">
                    </div>

                    <!-- Final Preview Container (Now Square) -->
                    <div id="imagePreviewContainer" class="mt-4 hidden relative flex-col items-center">
                        <div class="relative">
                            <img id="imagePreview" src="#" alt="Preview" class="h-40 w-40 object-cover rounded-lg shadow-md border-4 border-white">
                            <button type="button" onclick="removeImage()" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full p-1.5 hover:bg-red-600 shadow-lg border-2 border-white transition-transform hover:scale-110" title="Remove Photo">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>
                        <p id="compressionStats" class="text-sm text-green-600 font-medium mt-3 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Photo Ready
                        </p>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                        Submit Data
                    </button>
                </div>
            </form>
            
            <!-- Success Message -->
            <div id="successMessage" class="hidden p-8 text-center bg-green-50">
                <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                    <svg class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h3 class="text-2xl font-bold text-green-800 mb-2">Success!</h3>
                <p class="text-green-600 mb-6">Your data has been submitted successfully.</p>
                <button type="button" onclick="resetForm()" class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium transition-colors">
                    Submit Another Entry
                </button>
            </div>
        </div>
    </main>


    <!-- 1. LIVE CAMERA MODAL -->
    <div id="cameraModal" class="hidden fixed inset-0 z-50 bg-black flex-col">
        <!-- Live Video Feed -->
        <video id="liveVideo" autoplay playsinline muted></video>
        
        <!-- The Guide Overlay (SQUARE Box + Head outline) -->
        <div class="camera-overlay-container">
            <div id="cameraGuideBox" class="camera-guide-box"></div>
        </div>

        <!-- Controls -->
        <div class="absolute bottom-0 left-0 right-0 p-6 pb-10 bg-gradient-to-t from-black to-transparent flex justify-between items-center z-20">
            <button type="button" onclick="stopLiveCamera()" class="text-white bg-gray-800/80 hover:bg-gray-700 px-6 py-2 rounded-full font-medium backdrop-blur-sm">
                Cancel
            </button>
            
            <!-- Capture Shutter Button -->
            <button type="button" onclick="captureLivePhoto()" class="w-16 h-16 bg-white rounded-full border-4 border-gray-300 flex items-center justify-center hover:scale-105 transition-transform">
                <div class="w-12 h-12 bg-white rounded-full shadow-inner"></div>
            </button>
            
            <div class="w-20"></div> <!-- Spacer for centering -->
        </div>
    </div>


    <!-- 2. GALLERY CROPPER MODAL (Fixed layout) -->
    <div id="cropperModal" class="hidden fixed inset-0 z-50 bg-black/95 flex-col backdrop-blur-sm">
        <div class="p-4 flex justify-between items-center text-white border-b border-gray-800 bg-black">
            <h3 class="font-semibold text-lg flex items-center">
                <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                Align Gallery Photo
            </h3>
            <button type="button" onclick="closeGalleryCropper()" class="text-gray-400 hover:text-white p-1 rounded-full bg-gray-800 hover:bg-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Fixed height container so image is never tiny -->
        <div style="height: calc(100vh - 140px); width: 100%;" class="relative bg-black">
            <img id="imageToCrop" src="" style="display: block; max-width: 100%;">
        </div>
        
        <div class="p-4 pb-8 sm:pb-4 bg-gray-900 border-t border-gray-800 flex justify-center space-x-4">
            <button type="button" onclick="applyCropAndSave()" id="btnApplyCrop" class="px-6 py-3 rounded-md bg-blue-600 text-white hover:bg-blue-700 shadow-lg font-medium flex items-center justify-center w-full">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Confirm Crop
            </button>
        </div>
    </div>


    <!-- Firebase & Cropper SDK Setup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC76wT0RbwuLGbhp0mU7kje25g-xxydLqU",
            authDomain: "idcard-60586.firebaseapp.com",
            projectId: "idcard-60586",
            storageBucket: "idcard-60586.firebasestorage.app",
            messagingSenderId: "331979663377",
            appId: "1:331979663377:web:026e537a7fcaca813129b0",
            measurementId: "G-PXVV87C78S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Globals
        window.selectedFile = null;
        let cropperInstance = null;
        let cameraStream = null;

        /* =========================================
           1. LIVE CAMERA SYSTEM (SQUARE)
        ========================================= */
        window.startLiveCamera = async function() {
            try {
                // Request back camera
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                const video = document.getElementById('liveVideo');
                video.srcObject = cameraStream;
                
                // Show camera modal
                document.getElementById('cameraModal').classList.remove('hidden');
                document.getElementById('cameraModal').classList.add('flex');
            } catch (err) {
                console.error("Camera error:", err);
                alert("Could not access camera. Please check permissions or use the Gallery option.");
            }
        };

        window.stopLiveCamera = function() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('cameraModal').classList.add('hidden');
            document.getElementById('cameraModal').classList.remove('flex');
        };

        window.captureLivePhoto = function() {
            const video = document.getElementById('liveVideo');
            const guideBox = document.getElementById('cameraGuideBox');
            
            // 1. Setup a hidden canvas to capture the raw video frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. Math to perfectly extract the area inside the Guide Box!
            const scale = Math.max(video.clientWidth / video.videoWidth, video.clientHeight / video.videoHeight);
            const offsetX = (video.clientWidth - video.videoWidth * scale) / 2;
            const offsetY = (video.clientHeight - video.videoHeight * scale) / 2;
            const guideRect = guideBox.getBoundingClientRect();
            
            const sourceX = (guideRect.left - offsetX) / scale;
            const sourceY = (guideRect.top - offsetY) / scale;
            const sourceW = guideRect.width / scale;
            const sourceH = guideRect.height / scale;

            // 3. Setup final 800x800 Square Canvas
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = 800; // Square width
            finalCanvas.height = 800; // Square height
            const finalCtx = finalCanvas.getContext('2d');

            // Draw just that specific cropped area into the final canvas
            finalCtx.drawImage(canvas, sourceX, sourceY, sourceW, sourceH, 0, 0, 800, 800);

            // 4. Save and Update UI
            // Quality 0.95 (95%) for maximum clarity
            finalCanvas.toBlob(function(blob) {
                window.selectedFile = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg' });
                
                document.getElementById('imagePreview').src = URL.createObjectURL(blob);
                document.getElementById('photoUploadUI').style.display = 'none';
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                document.getElementById('imagePreviewContainer').classList.add('flex');
                
                document.getElementById('compressionStats').innerHTML = `
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Live Photo Captured
                `;
                
                stopLiveCamera(); // Close camera
            }, 'image/jpeg', 0.95);
        };


        /* =========================================
           2. GALLERY CROPPER SYSTEM (SQUARE)
        ========================================= */
        window.openGalleryCropper = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('imageToCrop');
                imgElement.src = e.target.result;

                document.getElementById('cropperModal').classList.remove('hidden');
                document.getElementById('cropperModal').classList.add('flex');

                if (cropperInstance) cropperInstance.destroy();

                cropperInstance = new Cropper(imgElement, {
                    aspectRatio: 1 / 1, // SQUARE RATIO
                    viewMode: 1, 
                    dragMode: 'move',
                    autoCropArea: 0.9, 
                    guides: false,
                    center: false,
                    highlight: false,
                    background: true,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                });
            }
            reader.readAsDataURL(file);
        };

        window.closeGalleryCropper = function() {
            document.getElementById('cropperModal').classList.add('hidden');
            document.getElementById('cropperModal').classList.remove('flex');
            if (cropperInstance) cropperInstance.destroy();
            document.getElementById('photoGallery').value = '';
        };

        window.applyCropAndSave = function() {
            if (!cropperInstance) return;

            const btn = document.getElementById('btnApplyCrop');
            btn.innerHTML = 'Processing...';
            btn.disabled = true;

            const croppedCanvas = cropperInstance.getCroppedCanvas({
                width: 800, height: 800, // Square output dimensions
                imageSmoothingEnabled: true, imageSmoothingQuality: 'high',
            });

            // Quality 0.95 (95%) for maximum clarity
            croppedCanvas.toBlob(function(blob) {
                const fileInput = document.getElementById('photoGallery').files[0];
                const originalName = fileInput ? (fileInput.name.split('.')[0] || 'photo') : 'photo';
                
                window.selectedFile = new File([blob], `${originalName}_passport.jpg`, { type: 'image/jpeg' });

                document.getElementById('imagePreview').src = URL.createObjectURL(blob);
                document.getElementById('photoUploadUI').style.display = 'none';
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                document.getElementById('imagePreviewContainer').classList.add('flex');
                
                document.getElementById('compressionStats').innerHTML = `
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Photo Ready
                `;

                btn.innerHTML = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Confirm Crop';
                btn.disabled = false;
                closeGalleryCropper();
            }, 'image/jpeg', 0.95);
        };

        /* =========================================
           3. STANDARD FORM LOGIC 
        ========================================= */
        window.removeImage = function() {
            document.getElementById('photoGallery').value = '';
            window.selectedFile = null;
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imagePreviewContainer').classList.remove('flex');
            document.getElementById('imagePreview').src = '#';
            document.getElementById('photoUploadUI').style.display = 'flex';
        };

        window.resetForm = function() {
            document.getElementById('teacherForm').reset();
            window.removeImage();
            document.getElementById('teacherForm').style.display = 'block';
            document.getElementById('successMessage').classList.add('hidden');
        }

        document.getElementById('teacherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!window.selectedFile) {
                alert("Please provide a Teacher Photo by capturing or uploading one.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Uploading Data...
                `;

                const fileName = `student_photos/teachers/${Date.now()}_${window.selectedFile.name.replace(/[^a-zA-Z0-9._-]/g, '')}`;
                const storageRef = ref(storage, fileName);
                
                const uploadTask = await uploadBytesResumable(storageRef, window.selectedFile);
                const downloadURL = await getDownloadURL(uploadTask.ref);

                const teacherData = {
                    schoolName: document.getElementById('schoolName').value,
                    udiseCode: document.getElementById('udiseCode').value,
                    block: document.getElementById('block').value,
                    district: document.getElementById('district').value,
                    pin: document.getElementById('pin').value,
                    teacherName: document.getElementById('teacherName').value,
                    designation: document.getElementById('designation').value,
                    qualification: document.getElementById('qualification').value,
                    mobileNo: document.getElementById('mobileNo').value,
                    bloodGroup: document.getElementById('bloodGroup').value,
                    teacherCode: document.getElementById('teacherCode').value || 'N/A', 
                    photoUrl: downloadURL,
                    timestamp: serverTimestamp()
                };

                await addDoc(collection(db, "teachers"), teacherData);

                document.getElementById('teacherForm').style.display = 'none';
                document.getElementById('successMessage').classList.remove('hidden');
                
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("An error occurred: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
