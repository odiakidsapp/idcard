<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ID Cards Pro - Data Entry</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- INSTANT REDIRECT SCRIPT -->
    <!-- Executes before the page even paints, ensuring zero screen flashing for existing users -->
    <script>
        if (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true ||
            localStorage.getItem('pwaInstalled') === 'true'
        ) {
            window.location.replace('app.html');
        }
    </script>

    <style>
        /* Modern CSS Reset & Typography */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4f8;
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,94%,1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(210,100%,90%,1) 0, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
        }

        /* Premium Card Design */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* App Icon Styling */
        .app-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-radius: 22px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
            position: relative;
        }
        
        .app-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; color: #0f172a; }
        p.subtitle { font-size: 15px; color: #64748b; line-height: 1.5; margin-bottom: 30px; }

        /* Feature List */
        .features {
            text-align: left;
            margin-bottom: 35px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }
        .feature-item:last-child { margin-bottom: 0; }
        .feature-icon {
            width: 28px;
            height: 28px;
            background: #e0e7ff;
            color: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Call to Action Button */
        .btn {
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35); }
        .btn:active { transform: translateY(1px); box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Success State */
        .status-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: slideUp 0.4s ease forwards;
        }
        
        .success-icon {
            width: 60px;
            height: 60px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .status-text { font-size: 18px; font-weight: 700; color: #15803d; }
        
        /* Footer text */
        .footer-text { margin-top: 24px; font-size: 12px; color: #94a3b8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- Default State -->
        <div id="setupState">
            <div class="app-icon"><i class="fas fa-id-badge"></i></div>
            <h1>ID Cards Pro</h1>
            <p class="subtitle">Your dedicated portal for seamless student data collection.</p>
            
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-wifi-slash"></i></div>
                    Works 100% Offline
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-magic"></i></div>
                    Auto-Load Student Data
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-camera"></i></div>
                    Smart Photo Cropping
                </div>
            </div>

            <!-- Button is hidden until the browser confirms it can be installed -->
            <button class="btn" id="installBtn" style="display: none;">
                <i class="fas fa-download"></i> Install Application
            </button>
            
            <!-- Fallback text while waiting for install prompt -->
            <p id="loadingText" style="font-size: 13px; color: #64748b; font-weight: 600; margin-top: 10px;">
                <i class="fas fa-spinner fa-spin mr-1"></i> Checking device compatibility...
            </p>
        </div>

        <!-- Success State -->
        <div class="status-container" id="successState">
            <div class="success-icon"><i class="fas fa-check"></i></div>
            <div class="status-text">App Installed!</div>
            <p style="font-size: 14px; color: #64748b; margin-bottom: 5px;">Launching your portal securely...</p>
            <div style="width: 40px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; margin: 0 auto;">
                <div style="width: 100%; height: 100%; background: #2563eb; animation: loadBar 1.5s ease-in-out forwards;"></div>
            </div>
        </div>
    </div>
    
    <div class="footer-text">Secure &bull; Fast &bull; Reliable</div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const loadingText = document.getElementById('loadingText');
        const setupState = document.getElementById('setupState');
        const successState = document.getElementById('successState');

        // Listen for the browser's signal that the app can be installed
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // Prevent the mini-infobar from appearing on mobile
            
            // Safety: Double check we aren't already installed
            if (localStorage.getItem('pwaInstalled') === 'true') {
                window.location.replace('app.html');
                return;
            }
            
            // Store the event so it can be triggered later.
            deferredPrompt = e;
            
            // Update UI to show the install button
            loadingText.style.display = 'none';
            installBtn.style.display = 'flex';
        });

        // Handle the Install Button Click
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            
            installBtn.disabled = true;
            installBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Installing...';
            
            // Show the native browser install prompt
            deferredPrompt.prompt();
            
            // Wait for the user to respond to the prompt
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('User accepted the install prompt');
                // The 'appinstalled' event will fire next
            } else {
                console.log('User dismissed the install prompt');
                installBtn.disabled = false;
                installBtn.innerHTML = '<i class="fas fa-download"></i> Install Application'; 
            }
            deferredPrompt = null;
        });

        // Listen for the absolute confirmation that installation succeeded
        window.addEventListener('appinstalled', () => {
            // Set the flag so they never see this page again
            localStorage.setItem('pwaInstalled', 'true'); 
            
            // Swap out the UI to show a beautiful success animation
            setupState.style.display = 'none';
            successState.style.display = 'flex';
            
            // Route them to the app after letting them see the success state for 1.5 seconds
            setTimeout(() => {
                window.location.replace('app.html');
            }, 1500);
        });

        // Edge case: If the user opens this page in a normal browser tab, 
        // but it doesn't fire 'beforeinstallprompt' because they are on an unsupported device (like old Safari)
        setTimeout(() => {
            if(installBtn.style.display === 'none' && localStorage.getItem('pwaInstalled') !== 'true') {
                loadingText.innerHTML = "To install, tap <b>Share</b> <i class='fas fa-share-square mx-1'></i> and select <b>Add to Home Screen</b> <i class='fas fa-plus-square mx-1'></i>";
            }
        }, 3000);

        // Register Service Worker required for PWA functionality
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        }
        
        // Keyframe for the little loading bar in success state
        const style = document.createElement('style');
        style.innerHTML = `@keyframes loadBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(0); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
